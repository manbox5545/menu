<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>We've Moved | MPOXEL-FOODS</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5f6878;
      --accent: #1769ff;
      --accent-hover: #0d55d9;
      --line: #e8ecf2;
      --surface: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: clamp(28px, 6vw, 48px);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(23, 32, 51, 0.07);
    }

    .mark {
      width: 62px;
      height: 62px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #eaf1ff;
      color: var(--accent);
      font-size: 29px;
      font-weight: 800;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .message {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .old-name {
      display: block;
      margin: 18px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fafbfe;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .new-name {
      display: block;
      margin-top: 4px;
      color: var(--ink);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .button {
      display: flex;
      width: 100%;
      min-height: 56px;
      margin-top: 24px;
      padding: 16px 20px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    .button:hover { background: var(--accent-hover); }
    .button:active { transform: scale(0.99); }
    .button:focus-visible { outline: 3px solid #9dbdff; outline-offset: 3px; }

    .url {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 28px;
      color: #8a92a0;
      font-size: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <p class="eyebrow">A quick update</p>
    <h1>Thanks for visiting!</h1>

    <p class="message">
      Our website has moved. <strong>SGALAXYKITCHEN.SITE | PRACHI KITCHEN</strong>
      is now part of Mpoxel Foods.
    </p>

    <div class="old-name">
      Same food business, new name:
      <span class="new-name">MPOXEL-FOODS</span>
    </div>

    <p class="message">To order or visit us, tap the button below.</p>

    <a class="button" href="https://food.mpoxel.in/" aria-label="Go to the Mpoxel Foods website">
      GO TO THE FOOD WEBSITE
    </a>

    <p class="url">food.mpoxel.in</p>
    <footer>Thank you for your support.</footer>
  </main>
</body>
</html>
