<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prachi Cloud Kitchen — Controller</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Inter,sans-serif;
  color:#111;
  background:
    linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.62)),
    url("img.png") center/cover fixed;
  padding:25px;
}

.panel{
  width:min(1200px,100%);
  margin:auto;
  background:rgba(255,255,255,.96);
  border-radius:26px;
  padding:25px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

h1{
  font-family:Anton,sans-serif;
  letter-spacing:2px;
  font-size:36px;
}

.connection{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:700;
}

.connection-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#27ae60;
}

.orders{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:18px;
}

.order{
  border:1px solid #ddd;
  border-radius:20px;
  background:#fff;
  padding:19px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.order.new{
  border-color:#27ae60;
  box-shadow:0 0 0 3px rgba(39,174,96,.08);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:13px;
}

.order-id{
  font-size:11px;
  color:#888;
  word-break:break-all;
}

.order-total{
  font-weight:800;
  font-size:19px;
}

.customer{
  padding:12px;
  background:#f6f6f6;
  border-radius:13px;
  margin-bottom:13px;
  line-height:1.55;
  font-size:13px;
}

.food{
  border-top:1px solid #eee;
  padding-top:12px;
}

.food-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  padding:5px 0;
}

.status{
  margin:14px 0;
  padding:11px 13px;
  border-radius:12px;
  background:#eef8f1;
  color:#1d6f3a;
  font-size:13px;
  font-weight:800;
}

.status.pending{
  background:#fff5d9;
  color:#735600;
}

select{
  width:100%;
  border:2px solid #ddd;
  border-radius:12px;
  padding:12px;
  background:#fff;
  color:#111;
  font:600 14px Inter,sans-serif;
  cursor:pointer;
}

select:focus{
  outline:0;
  border-color:#111;
}

.empty{
  text-align:center;
  padding:70px 20px;
  color:#777;
}

.error{
  text-align:center;
  padding:60px 20px;
  color:#c0392b;
  font-weight:700;
}

.admin{
  display:inline-block;
  margin-top:6px;
  padding:4px 8px;
  background:#111;
  color:#fff;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
}

.logout{
  margin-top:10px;
  padding:7px 10px;
  border:0;
  border-radius:8px;
  background:#eee;
  cursor:pointer;
  font-weight:700;
}

@media(max-width:600px){

  body{
    padding:12px;
  }

  .panel{
    padding:17px;
    border-radius:21px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  h1{
    font-size:30px;
  }

  .orders{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<main class="panel">

  <div class="header">

    <div>

      <h1>ORDER CONTROLLER</h1>

      <p style="color:#777;margin-top:5px">
        Prachi Cloud Kitchen
      </p>

      <div id="adminInfo"></div>

    </div>

    <div class="connection">

      <span class="connection-dot"></span>

      REALTIME FIREBASE

    </div>

  </div>


  <div class="orders" id="orders">

    <div class="empty">
      Checking admin session...
    </div>

  </div>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyBq7UEsIwoudC2g8DRrG7EwqblX9SIDCF8",
  authDomain: "ticktok-7fb30.firebaseapp.com",
  databaseURL: "https://ticktok-7fb30-default-rtdb.firebaseio.com",
  projectId: "ticktok-7fb30",
  storageBucket: "ticktok-7fb30.firebasestorage.app",
  messagingSenderId: "493782050714",
  appId: "1:493782050714:web:5f6bd9eae6af68b250fc23",
  measurementId: "G-3KH8Y1SVDG"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const ordersRef = ref(db,"orders");

const ordersEl =
  document.getElementById("orders");

const adminInfo =
  document.getElementById("adminInfo");


/* =========================
   STATUS OPTIONS
========================= */

const statuses = [

  "Order taken 📝",

  "Preparing your food 🥣",

  "Packaging it 📦",

  "Billing it 🧾",

  "Out for delivery 🚚",

  "you order arrived to the reception of your building/block 🏢, thankyou for ordering 😄",

  "Hope you'll order again 😀",
  
  "Order has been canceled ❌"

];


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


/* =========================
   RENDER
========================= */

function renderOrders(data){

  const entries =
    Object.entries(data || {}).reverse();


  if(!entries.length){

    ordersEl.innerHTML =
      '<div class="empty">No orders yet.</div>';

    return;

  }


  ordersEl.innerHTML =
    entries.map(([id,order]) => {

      const status =
        order.status ||
        "Admin is receiving your order";


      const isPending =
        !order.status;


      const food =
        Array.isArray(order.food)
        ? order.food.map(item => `

          <div class="food-row">

            <span>
              ${escapeHtml(item.name)}
              ×
              ${escapeHtml(item.quantity)}
            </span>

            <strong>
              ₹${escapeHtml(item.subtotal)}
            </strong>

          </div>

        `).join("")
        : "";


      const selected =
        statuses.includes(status)
        ? status
        : "";


      return `

        <article class="order ${isPending ? "new" : ""}">

          <div class="order-top">

            <div>

              <strong>ORDER</strong>

              <div class="order-id">
                ${escapeHtml(id)}
              </div>

            </div>

            <div class="order-total">
              ₹${escapeHtml(order.bill)}
            </div>

          </div>


          <div class="customer">

            <strong>
              ${escapeHtml(order.customerName)}
            </strong>

            <br>

            📱 ${escapeHtml(order.phone)}

            <br>

            🏢 Block ${escapeHtml(order.block)}

            <br>

            💵 ${escapeHtml(order.paymentMethod)}

          </div>


          <div class="food">

            ${food}

          </div>


          <div class="status ${isPending ? "pending" : ""}">

            ${escapeHtml(status)}

          </div>


          <select data-order-id="${escapeHtml(id)}">

            <option
              value=""
              disabled
              ${!selected ? "selected" : ""}
            >
              Select order message...
            </option>

            ${
              statuses.map(option => `

                <option
                  value="${escapeHtml(option)}"
                  ${selected === option ? "selected" : ""}
                >
                  ${escapeHtml(option)}
                </option>

              `).join("")
            }

          </select>

        </article>

      `;

    }).join("");

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async user => {

  /*
    No Firebase session.

    Send admin to login.
  */

  if(!user){

    location.href = "admin-login.html";

    return;

  }


  try{

    /*
      Force-refresh the ID token so the latest
      admin custom claim is checked.
    */

    const tokenResult =
      await user.getIdTokenResult(true);


    /*
      SECURITY CHECK

      Your Firebase rule uses:

      auth.token.admin === true
    */

    if(tokenResult.claims.admin !== true){

      await signOut(auth);

      alert(
        "This account does not have administrator access."
      );

      location.href = "admin-login.html";

      return;

    }


    /* =========================
       ADMIN VERIFIED
    ========================= */

    adminInfo.innerHTML = `

      <span class="admin">
        ADMIN
      </span>

      <button
        class="logout"
        id="logoutButton"
      >
        Logout
      </button>

    `;


    document
      .getElementById("logoutButton")
      .addEventListener("click", async () => {

        await signOut(auth);

        location.href =
          "admin-login.html";

      });


    /* =========================
       LOAD ALL ORDERS
    =========================

       Because admin === true,
       this is allowed by your rule:

       /orders
       .read
    */

    onValue(

      ordersRef,

      snapshot => {

        renderOrders(
          snapshot.val()
        );

      },

      error => {

        console.error(error);

        ordersEl.innerHTML = `

          <div class="error">

            Firebase could not load orders.

            <br><br>

            ${escapeHtml(error.message)}

          </div>

        `;

      }

    );


  }catch(error){

    console.error(error);

    await signOut(auth);

    location.href =
      "admin-login.html";

  }

});


/* =========================
   UPDATE ORDER STATUS
========================= */

ordersEl.addEventListener(
  "change",
  async event => {

    const select =
      event.target.closest(
        "select[data-order-id]"
      );


    if(!select || !select.value)
      return;


    const orderId =
      select.dataset.orderId;


    try{

      await update(

        ref(
          db,
          `orders/${orderId}`
        ),

        {
          status:select.value,
          statusUpdatedAt:Date.now()
        }

      );


    }catch(error){

      console.error(error);

      alert(
        "Could not update order status."
      );

    }

  }
);

</script>

</body>
</html>
